<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPU算力计算器</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: white;
            font-size: 2.5rem;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .controls {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-weight: 600;
            color: #333;
            font-size: 0.9rem;
        }

        select, button {
            padding: 12px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        select:focus, button:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
            padding: 12px 40px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .charts-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(600px, 1fr));
            gap: 30px;
            margin-bottom: 30px;
        }

        .chart-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .chart-card h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5rem;
            text-align: center;
        }

        canvas {
            max-width: 100%;
            height: 400px;
        }

        .results-table {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow-x: auto;
        }

        .results-table h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5rem;
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #e0e0e0;
        }

        th {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-weight: 600;
        }

        tr:hover {
            background: #f5f5f5;
        }

        .precision-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            color: white;
        }

        .fp32 {
            background: #4CAF50;
        }

        .fp64 {
            background: #2196F3;
        }

        .fp16 {
            background: #FF9800;
        }

        .bf16 {
            background: #9C27B0;
        }

        .int8 {
            background: #F44336;
        }

        .int4 {
            background: #795548;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8rem;
            }

            .controls {
                flex-direction: column;
                align-items: stretch;
            }

            .charts-container {
                grid-template-columns: 1fr;
            }

            .chart-card {
                padding: 20px;
            }

            th, td {
                padding: 10px 5px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>GPU算力计算器</h1>
        
        <div class="controls">
            <div class="control-group">
                <label for="gpuSelect">选择GPU型号 (可多选):</label>
                <select id="gpuSelect" multiple size="4">
                    <option value="A100" selected>A100</option>
                    <option value="H100">H100</option>
                    <option value="H200">H200</option>
                    <option value="A40">A40</option>
                    <option value="A10">A10</option>
                    <option value="L40S">L40S</option>
                    <option value="RTX 4090">RTX 4090</option>
                    <option value="A800">A800</option>
                </select>
            </div>
            
            <div class="control-group">
                <label for="precisionSelect">选择计算精度 (可多选):</label>
                <select id="precisionSelect" multiple size="4">
                    <option value="FP32" selected>FP32</option>
                    <option value="FP64" selected>FP64</option>
                    <option value="FP16" selected>FP16</option>
                    <option value="BF16" selected>BF16</option>
                    <option value="INT8" selected>INT8</option>
                    <option value="INT4" selected>INT4</option>
                </select>
            </div>
            
            <button id="calculateBtn">计算算力</button>
        </div>

        <div class="charts-container">
            <div class="chart-card">
                <h2>算力对比 - 柱状图</h2>
                <canvas id="barChart"></canvas>
            </div>
        </div>

        <div class="results-table">
            <h2>算力计算结果</h2>
            <table id="resultsTable">
                <thead>
                    <tr>
                        <th>GPU型号</th>
                        <th>计算精度</th>
                        <th>算力 (TFLOPS/TOPS)</th>
                    </tr>
                </thead>
                <tbody id="resultsBody">
                </tbody>
            </table>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
